name: Build PlayCover 1507

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout PlayCover
        uses: actions/checkout@v4
        with:
          repository: PlayCover/PlayCover
          ref: 9cd08d8dbb914b67b7db426e4ddf9297a3bd63be

      - name: Install dependencies
        run: |
          brew install swiftlint carthage
          gem install bundler
          bundle install

      - name: Build Carthage dependencies
        env:
          FASTLANE: "1"
        run: |
          carthage update --use-xcframeworks

      - name: Build PlayCover
        env:
          FASTLANE: "1"
          EXPANDED_CODE_SIGN_IDENTITY_NAME: "-"
        run: |
          mkdir -p output

          xcodebuild \
            -project PlayCover.xcodeproj \
            -scheme PlayCover \
            -configuration Nightly \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Verify PlayCover.app
        run: |
          APP_PATH="build/Build/Products/Nightly/PlayCover.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: PlayCover.app was not found."
            exit 1
          fi

          echo "PlayCover.app successfully built:"
          ls -lah "$APP_PATH"

      - name: Create unsigned DMG
        run: |
          APP_PATH="build/Build/Products/Nightly/PlayCover.app"
          STAGING="dmg-staging"
          DMG="output/PlayCover_nightly_1507.dmg"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          mkdir -p output

          echo "Copying PlayCover.app..."
          cp -R "$APP_PATH" "$STAGING/PlayCover.app"

          echo "Creating Applications shortcut..."
          ln -s /Applications "$STAGING/Applications"

          echo "Creating DMG..."
          hdiutil create \
            -volname "PlayCover 1507" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG"

          echo "DMG created successfully:"
          ls -lh "$DMG"

      - name: Upload PlayCover DMG
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_nightly_1507.dmg
          path: output/PlayCover_nightly_1507.dmg
          retention-days: 90
